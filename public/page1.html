<!-- Tailwind Configuration -->
<script>

<!-- BEGIN: Custom CSS Styles -->
<style data-purpose="custom-animations">
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 0.7; }
    }
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes sparkFloat {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .animate-float {
      animation: floatSoft 5s ease-in-out infinite;
    }
    .animate-sparkle {
      animation: sparkFloat 3.5s ease-in-out infinite;
    }
    .wine-blur-blob {
      filter: blur(65px);
    }
  </style>
<style data-purpose="glassmorphism">
    .glass-card {
      background: rgba(85, 24, 38, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 225, 230, 0.22);
      box-shadow: 0 16px 36px -8px rgba(43, 7, 15, 0.35), inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glow-button {
      box-shadow: 0 8px 24px -2px rgba(239, 59, 100, 0.55), 0 0 12px rgba(255, 77, 122, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-button:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px -2px rgba(239, 59, 100, 0.6);
    }
  </style>
<!-- END: Custom CSS Styles -->

<!-- BEGIN: InteractiveCelebrationScript -->
<script data-purpose="celebration-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.querySelector('[data-purpose="primary-celebration-trigger"]');
      if (startBtn) {
        startBtn.addEventListener('click', (e) => {
          // Gentle tactile feedback style pulse on click, then navigate
          startBtn.style.transform = 'scale(0.95)';
          setTimeout(() => {
            startBtn.style.transform = '';
            window.location.href = '/page2';
          }, 150);

          // Subtle alert celebration message
          console.log("Welcome to Chapter 20, Bhoomi!");
        });
      }
    });
  </script>
<!-- END: InteractiveCelebrationScript -->
